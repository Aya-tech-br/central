{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
  <header><h1>Mala direta AYA</h1></header>
  <div class="carta">
    <h2 style="margin-top:0">Entrar</h2>
    {% if aviso %}<p class="aviso">{{ aviso }}</p>{% endif %}
    <form method="post" action="/entrar">
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" autocomplete="username" required autofocus />
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="current-password" required />
      </div>
      <button type="submit">Entrar</button>
    </form>
  </div>
{% endblock %}
