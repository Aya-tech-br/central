[project]
name = "mala-direta-pdf"
version = "0.1.0"
description = "Gera um PDF personalizado por linha de uma planilha e envia por e-mail com o anexo correspondente."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pydantic>=2.6",
    "pypdf>=5.0",
    "reportlab>=4.1",
]

[project.optional-dependencies]
web = [
    "bcrypt>=4.1",
    "fastapi>=0.110",
    "itsdangerous>=2.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
mala-direta = "mala_direta.cli:main"
mala-direta-web = "mala_direta.web.servidor:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mala_direta = ["web/templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Form/File/Depends no valor padrão são o idioma do FastAPI, não o bug que o B008 caça.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
